{% extends "base.html" %}
{% block title %}Account{% endblock %}
{% block content %}
<div class="page-header">
  <h1>Account</h1>
</div>

<div class="card" style="max-width:480px">
  <h2>Profile</h2>
  <div class="form-group">
    <label>Display Name</label>
    <p style="font-size:16px">{{ g.user.display_name }}</p>
  </div>
  <div class="form-group">
    <label>Email</label>
    <p style="font-size:16px">{{ g.user.email }}</p>
  </div>
  <div class="form-group">
    <label>Member Since</label>
    <p style="font-size:14px;color:var(--text-secondary)">{{ g.user.created_at[:10] }}</p>
  </div>
  <div class="form-actions">
    <a href="{{ url_for('logout') }}" class="btn btn-secondary">Log Out</a>
  </div>
</div>
{% endblock %}
